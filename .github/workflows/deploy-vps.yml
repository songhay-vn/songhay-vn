name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/songhay_vps
          chmod 600 ~/.ssh/songhay_vps
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Fetch build.env from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/songhay_vps -P ${VPS_PORT:-22}"
          scp $SSH_OPTS "$VPS_USER@$VPS_HOST:/opt/songhay/env/build.env" .env

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Open SSH tunnel to database
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/songhay_vps -p ${VPS_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ssh $SSH_OPTS -N -f -L 5432:127.0.0.1:5432 "$VPS_USER@$VPS_HOST"
          sleep 3

      - name: Apply migrations to production DB
        run: |
          set -euo pipefail
          # Apply committed migrations to the production DB via the SSH tunnel
          bunx --bun prisma migrate deploy

      - name: Build Next.js app
        run: bun run build

      - name: Close SSH tunnel
        run: |
          pkill -f "ssh.*-L 5432:127.0.0.1:5432" || true

      - name: Remove .env file
        run: rm -f .env

      - name: Build Docker Image
        run: |
          mkdir -p release-context
          cp -a .next/standalone/. release-context/
          cp -a .next/static release-context/.next/static
          cp -a public release-context/public
          cp deploy/vps/Dockerfile.runtime release-context/Dockerfile
          docker build -t songhay-app:latest release-context

      - name: Upload source code to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/songhay_vps -p ${VPS_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.agents/' \
            --exclude='.claude/' \
            --exclude='.gitnexus/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='coverage/' \
            --exclude='generated/' \
            --exclude='*.log' \
            -e "ssh $SSH_OPTS" \
            ./ "$VPS_USER@$VPS_HOST:/opt/songhay/source/"

      - name: Upload Docker Image to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/songhay_vps -p ${VPS_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          docker save songhay-app:latest | gzip | ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "gzip -d | docker load"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/songhay_vps -p ${VPS_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "bash /opt/songhay/source/deploy/vps/deploy.sh"
